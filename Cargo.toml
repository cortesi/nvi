
[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Aldo Cortesi <aldo@corte.si>"]

[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "tests"]

[workspace.dependencies]
macro-types = { path = "crates/macro-types" }
mrpc = { path = "../mrpc" }
nvi = { path = "crates/nvi" }
nvi-macros = { path = "crates/nvi-macros" }

anyhow = "1.0.105"
async-trait = "0.1.92"
clap = "4.6.10"
clap-verbosity-flag = "3.0.4"
colornames = "0.0.6"
derive_setters = "0.1.9"
futures = "0.3.34"
futures-util = "0.3.34"
heck = "0.5.0"
nix = "0.32.0"
prettyplease = "0.3.0"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.2"
rmp = "0.8.15"
rmp-serde = "1.3.1"
rmpv = "1.3.1"
rust-format = "0.3.4"
serde = "1.0.229"
serde-rmpv = "0.0.1"
serde_derive = "1.0.229"
serde_with = "3.25.0"
strum = "0.28.0"
syn = "3.0.10"
tempfile = "3.27.0"
termcolor = "1.4.1"
textwrap = "0.16.4"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
tracing-test = "0.2.6"

[workspace.lints.rust]
missing_docs = "warn"

# unused_results = "warn"
# unreachable_pub = "warn"
# unqualified_local_imports = "warn"

[workspace.lints.clippy]
absolute_paths = "warn"
branches_sharing_code = "warn"
ignore_without_reason = "warn"
let_underscore_must_use = "warn"
many_single_char_names = "warn"
missing_docs_in_private_items = "warn"
multiple_inherent_impl = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
self_named_module_files = "warn"
tests_outside_test_module = "warn"
use_self = "warn"
wildcard_dependencies = "warn"
cfg_not_test = "warn"
comparison_chain = "warn"
items_after_statements = "warn"
needless_pass_by_ref_mut = "warn"

# Settings with config values in clippy.toml
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"

# too_many_lines = "warn"
# multiple_crate_versions = "warn"
# module_name_repetitions = "warn"
# Not really usable - errors on names like min_x/min_y
# similar_names = "warn"

[workspace.metadata.nanocode]
schema-version = 1
requires-nanocode = ">=0.1, <0.2"
features = "all"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
