[package]
name = "nvi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
macro-types.workspace = true
mrpc = { workspace = true, features = ["serde"] }
nvi-macros.workspace = true
async-trait.workspace = true
clap = { workspace = true, features = ["derive"] }
clap-verbosity-flag.workspace = true
colornames.workspace = true
derive_setters.workspace = true
futures.workspace = true
futures-util.workspace = true
nix = { workspace = true, features = ["signal"] }
rmp.workspace = true
rmp-serde.workspace = true
rmpv = { workspace = true, features = ["with-serde"] }
serde.workspace = true
serde-rmpv.workspace = true
serde_derive.workspace = true
serde_with.workspace = true
strum = { workspace = true, features = ["derive"] }
tempfile.workspace = true
termcolor.workspace = true
textwrap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter"] }

[dev-dependencies]
pretty_assertions.workspace = true
tracing-test.workspace = true
